<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Registration — Beta Tech Solutions</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 2rem;
      width: 100%;
      max-width: 680px;
      height: fit-content;
    }
    .card-header {
      border-bottom: 1px solid #eee;
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .card-header p { font-size: 13px; color: #666; margin-bottom: 2px; }
    .card-header h1 { font-size: 20px; font-weight: 500; color: #111; }
    .row { display: grid; gap: 16px; margin-bottom: 16px; }
    .row.col-2 { grid-template-columns: 1fr 1fr; }
    .row.col-3 { grid-template-columns: 1fr 1fr 1fr; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
    input[type="text"], input[type="number"], input[type="date"],
    select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      color: #111;
    }
    textarea { resize: vertical; }
    .radio-group { display: flex; gap: 24px; flex-wrap: wrap; }
    .radio-group label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 1.5rem; cursor: pointer; }
    .required { color: #e24b4a; }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      border-top: 1px solid #eee;
      padding-top: 1rem;
    }
    button {
      padding: 8px 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button.primary {
      background: #e6f1fb;
      color: #185fa5;
      border-color: #85b7eb;
    }
    #msg {
      display: none;
      margin-top: 1rem;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
    }
    #msg.success { background: #eaf3de; color: #3b6d11; border: 1px solid #97c459; }
    #msg.error   { background: #fcebeb; color: #a32d2d; border: 1px solid #f09595; }

    @media (max-width: 540px) {
      .row.col-2, .row.col-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <p>Beta Tech Solutions Ltd — Musanze District</p>
      <h1>Product registration</h1>
    </div>

    <form id="productForm" novalidate>

      <div class="row col-2">
        <div>
          <label for="productName">Product name <span class="required">*</span></label>
          <input type="text" id="productName" placeholder="e.g. Wireless Mouse X200" />
        </div>
        <div>
          <label for="sku">Product ID / SKU <span class="required">*</span></label>
          <input type="text" id="sku" placeholder="e.g. SKU-00142" />
        </div>
      </div>

      <div class="row col-2">
        <div>
          <label for="category">Category <span class="required">*</span></label>
          <select id="category">
            <option value="">— Select category —</option>
            <option>Electronics</option>
            <option>Software</option>
            <option>Hardware</option>
            <option>Accessories</option>
            <option>Networking</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label for="brand">Brand / Manufacturer <span class="required">*</span></label>
          <input type="text" id="brand" placeholder="e.g. TechCore Ltd" />
        </div>
      </div>

      <div class="row col-3">
        <div>
          <label for="price">Unit price (RWF) <span class="required">*</span></label>
          <input type="number" id="price" placeholder="0.00" min="0" step="0.01" />
        </div>
        <div>
          <label for="qty">Quantity in stock <span class="required">*</span></label>
          <input type="number" id="qty" placeholder="0" min="0" />
        </div>
        <div>
          <label for="weight">Weight (kg)</label>
          <input type="number" id="weight" placeholder="0.00" min="0" step="0.01" />
        </div>
      </div>

      <div class="row col-2">
        <div>
          <label for="regDate">Registration date <span class="required">*</span></label>
          <input type="date" id="regDate" />
        </div>
        <div>
          <label for="expDate">Expiry / warranty date</label>
          <input type="date" id="expDate" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="description">Product description</label>
          <textarea id="description" rows="3" placeholder="Brief description of the product..."></textarea>
        </div>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="margin-bottom: 8px;">Product status <span class="required">*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="status" value="active" checked /> Active</label>
          <label><input type="radio" name="status" value="inactive" /> Inactive</label>
          <label><input type="radio" name="status" value="discontinued" /> Discontinued</label>
        </div>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="confirm" />
        I confirm that all product information provided is accurate and complete.
      </label>

      <div class="actions">
        <button type="button" onclick="clearForm()">Clear form</button>
        <button type="button" class="primary" onclick="submitForm()">Register product</button>
      </div>

      <div id="msg"></div>
    </form>
  </div>

  <script>
    function clearForm() {
      document.getElementById('productForm').reset();
      showMsg('', '');
    }

    function submitForm() {
      const name    = document.getElementById('productName').value.trim();
      const sku     = document.getElementById('sku').value.trim();
      const cat     = document.getElementById('category').value;
      const brand   = document.getElementById('brand').value.trim();
      const price   = document.getElementById('price').value.trim();
      const qty     = document.getElementById('qty').value.trim();
      const regDate = document.getElementById('regDate').value;
      const confirm = document.getElementById('confirm').checked;

      if (!name || !sku || !cat || !brand || !price || !qty || !regDate) {
        showMsg('Please fill in all required fields.', 'error');
        return;
      }
      if (!confirm) {
        showMsg('Please confirm that the information is accurate.', 'error');
        return;
      }
      showMsg('Product registered successfully!', 'success');
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      if (!text) { el.style.display = 'none'; return; }
      el.style.display = 'block';
      el.className = type;
      el.textContent = text;
    }
  </script>
</body>
</html>
